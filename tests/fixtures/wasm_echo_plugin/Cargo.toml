[package]
name = "wasm-echo-plugin"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately outside the workspace: it builds for wasm32-wasip2, and a
# member that only compiles for another target breaks `cargo build --workspace`.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.48"

[profile.release]
opt-level = "s"
strip = true
